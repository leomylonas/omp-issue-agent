services:
  issue-agent:
    build:
      context: ..
      dockerfile: Dockerfile
    image: issue-agent:local
    env_file:
      - ./issue-agent.env
    environment:
      ASPNETCORE_URLS: http://+:8080
      HOME: /data
      PI_CODING_AGENT_DIR: /data/omp/agent
      PI_CODING_AGENT_SESSION_DIR: /data/omp
      IssueAgent__Workspace__RootPath: /data
      IssueAgent__Omp__ExecutablePath: /usr/local/bin/omp-unprivileged
      PI_CONFIG_FILES: /etc/omp/config.yml
    secrets:
      - source: github_token
        target: /run/secrets-source/github_token
        mode: 0400
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - issue-agent-data:/data
      - ./omp:/etc/omp:ro
    read_only: true
    tmpfs:
      - /tmp
      - /run/issue-agent-secrets
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETGID
      - SETPCAP
      - SETUID
    stop_grace_period: 25s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 6

secrets:
  github_token:
    file: ./secrets/github-token

volumes:
  issue-agent-data:
