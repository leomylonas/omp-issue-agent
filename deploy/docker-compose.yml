services:
  issue-agent:
    build:
      context: ..
      dockerfile: Dockerfile
    image: issue-agent:local
    env_file:
      - ./issue-agent.env
    environment:
      ASPNETCORE_URLS: http://+:8080
      HOME: /data
      PI_CODING_AGENT_DIR: /data/omp/agent
      PI_CODING_AGENT_SESSION_DIR: /data/omp
      IssueAgent__Workspace__RootPath: /data
      IssueAgent__Omp__ExecutablePath: /usr/local/bin/omp
      PI_CONFIG_FILES: /etc/omp/config.yml
    secrets:
      - github_token
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - issue-agent-data:/data
      - ./omp:/etc/omp:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
secrets:
  github_token:
    file: ./secrets/github-token

volumes:
  issue-agent-data:
