image:
  # This is the image published by the release workflow. Override for private registries.
  repository: ghcr.io/leomylonas/omp-issue-agent
  tag: ""
  pullPolicy: IfNotPresent

workspace:
  size: 8Gi
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  existingClaim: ""

omp:
  config:
    # OMP consumes a platform path-list of files, not a directory.
    existingConfigMap: ""
    existingConfigMapChecksum: ""
    mountPath: /etc/omp
    file: config.yml
    data:
      config.yml: "{}"
  authBroker:
    enabled: false
    # The IssueAgent image contains the pinned OMP binary and is also the
    # bundled broker image. Leave repository empty to inherit image.repository;
    # override only for a separately published compatible broker image.
    image:
      repository: ""
      tag: ""
    # This key must be present in secret.existingSecret or secret.stringData
    # when the broker is enabled. Supply its value with --set-file, never
    # directly on the Helm command line.
    tokenSecretKey: OMP_AUTH_BROKER_TOKEN
    existingClaim: ""
    storage:
      size: 1Gi
      accessModes: [ReadWriteOnce]
      storageClassName: ""
secret:
  existingSecret: ""
  existingSecretChecksum: ""
  stringData: {}

grafana:
  dashboard:
    enabled: false
    additionalLabels: {}

terminationGracePeriodSeconds: 25

service:
  type: ClusterIP
  port: 8080

resources: {}

serviceMonitor:
  enabled: false
  interval: 30s
  jobLabel: app.kubernetes.io/name
  additionalLabels: {}

prometheusRule:
  enabled: false
  additionalLabels: {}
  pollingStalledFor: 15m
  longRunningOperationThresholdSeconds: 1800

config:
  existingConfigMap: ""
  existingConfigMapChecksum: ""
  pollInterval: "00:01:00"
  concurrencyAgent: 3
  concurrencyPolling: 10
  ompExecutablePath: /usr/local/bin/omp-unprivileged
  traceSamplingRatio: "1.0"
  otlpEndpoint: ""
  extra: {}
