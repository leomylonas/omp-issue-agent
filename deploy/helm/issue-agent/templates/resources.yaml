{{- if not .Values.workspace.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "issue-agent.fullname" . }}
  labels:
    {{- include "issue-agent.labels" . | nindent 4 }}
spec:
  accessModes: {{- toYaml .Values.workspace.accessModes | nindent 4 }}
  {{- if .Values.workspace.storageClassName }}
  storageClassName: {{ .Values.workspace.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.workspace.size }}
{{- end }}
---
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "issue-agent.fullname" . }}
  labels:
    {{- toYaml .Values.serviceMonitor.additionalLabels | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/component: issue-agent
      {{- include "issue-agent.selectorLabels" . | nindent 6 }}
  jobLabel: {{ .Values.serviceMonitor.jobLabel | quote }}
  targetLabels:
    - app.kubernetes.io/instance
    - app.kubernetes.io/namespace
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
---
{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "issue-agent.fullname" . }}
  labels:
    {{- toYaml .Values.prometheusRule.additionalLabels | nindent 4 }}
spec:
  groups:
    - name: issue-agent
      rules:
        - alert: IssueAgentDown
          expr: up{app_kubernetes_io_instance="{{ .Release.Name }}",app_kubernetes_io_namespace="{{ .Release.Namespace }}"} == 0 or absent(up{app_kubernetes_io_instance="{{ .Release.Name }}",app_kubernetes_io_namespace="{{ .Release.Namespace }}"})
          for: 5m
        - alert: IssueAgentPollingStalled
          expr: increase(issueagent_poll_count_total{app_kubernetes_io_instance="{{ .Release.Name }}",app_kubernetes_io_namespace="{{ .Release.Namespace }}"}[{{ .Values.prometheusRule.pollingStalledFor }}]) == 0 or absent(issueagent_poll_count_total{app_kubernetes_io_instance="{{ .Release.Name }}",app_kubernetes_io_namespace="{{ .Release.Namespace }}"})
          for: {{ .Values.prometheusRule.pollingStalledFor }}
        - alert: IssueAgentProviderFailures
          expr: rate(issueagent_provider_errors_total{app_kubernetes_io_instance="{{ .Release.Name }}",app_kubernetes_io_namespace="{{ .Release.Namespace }}"}[10m]) > 0 or rate(issueagent_poll_errors_total{app_kubernetes_io_instance="{{ .Release.Name }}",app_kubernetes_io_namespace="{{ .Release.Namespace }}"}[10m]) > 0
          for: 10m
        - alert: IssueAgentOmpFailures
          expr: rate(issueagent_omp_errors_total{app_kubernetes_io_instance="{{ .Release.Name }}",app_kubernetes_io_namespace="{{ .Release.Namespace }}"}[10m]) > 0
          for: 10m
        - alert: IssueAgentGitFailures
          expr: rate(issueagent_git_errors_total{app_kubernetes_io_instance="{{ .Release.Name }}",app_kubernetes_io_namespace="{{ .Release.Namespace }}"}[10m]) > 0 or rate(issueagent_lfs_errors_total{app_kubernetes_io_instance="{{ .Release.Name }}",app_kubernetes_io_namespace="{{ .Release.Namespace }}"}[10m]) > 0
          for: 10m
        - alert: IssueAgentWorkflowFailures
          expr: rate(issueagent_plans_errors_total{app_kubernetes_io_instance="{{ .Release.Name }}",app_kubernetes_io_namespace="{{ .Release.Namespace }}"}[10m]) > 0 or rate(issueagent_implementations_errors_total{app_kubernetes_io_instance="{{ .Release.Name }}",app_kubernetes_io_namespace="{{ .Release.Namespace }}"}[10m]) > 0
          for: 10m
        - alert: IssueAgentLongRunningOperations
          expr: issueagent_operations_oldest_active_age_seconds{app_kubernetes_io_instance="{{ .Release.Name }}",app_kubernetes_io_namespace="{{ .Release.Namespace }}"} > {{ .Values.prometheusRule.longRunningOperationThresholdSeconds }}
          for: 5m
{{- end }}
