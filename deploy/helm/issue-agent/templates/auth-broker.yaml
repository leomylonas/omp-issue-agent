{{- if .Values.omp.authBroker.enabled }}
{{- $brokerRepository := default .Values.image.repository .Values.omp.authBroker.image.repository }}
{{- $brokerTag := default (default .Chart.AppVersion .Values.image.tag) .Values.omp.authBroker.image.tag }}
{{- if or (empty $brokerRepository) (empty $brokerTag) }}
{{- fail "a broker image repository and tag are required when the Auth Broker is enabled" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "issue-agent.fullname" . }}-auth-broker
  labels:
    {{- include "issue-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: auth-broker
      {{- include "issue-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: auth-broker
        {{- include "issue-agent.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-broker
          image: "{{ $brokerRepository }}:{{ $brokerTag }}"
          command: ["/usr/local/bin/omp"]
          args: ["auth-broker", "serve", "--bind=0.0.0.0:8081"]
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: HOME
              value: /data
            - name: PI_CODING_AGENT_DIR
              value: /data/omp/agent
          readinessProbe:
            httpGet:
              path: /v1/healthz
              port: http
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: broker-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: broker-data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-auth-broker" (include "issue-agent.fullname" .)) .Values.omp.authBroker.existingClaim }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "issue-agent.fullname" . }}-auth-broker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: auth-broker
    {{- include "issue-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8081
      targetPort: http
{{- if not .Values.omp.authBroker.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "issue-agent.fullname" . }}-auth-broker
spec:
  accessModes: {{- toYaml .Values.omp.authBroker.storage.accessModes | nindent 4 }}
  {{- if .Values.omp.authBroker.storage.storageClassName }}
  storageClassName: {{ .Values.omp.authBroker.storage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.omp.authBroker.storage.size }}
{{- end }}
{{- end }}
