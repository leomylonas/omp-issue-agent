{{- $ompConfigChecksum := include "issue-agent.omp-config.data" . | sha256sum }}
{{- if .Values.omp.config.existingConfigMap }}
{{- $ompConfig := lookup "v1" "ConfigMap" .Release.Namespace .Values.omp.config.existingConfigMap }}
{{- if $ompConfig }}
{{- $ompConfigChecksum = $ompConfig.data | toYaml | sha256sum }}
{{- else if .Values.omp.config.existingConfigMapChecksum }}
{{- $ompConfigChecksum = .Values.omp.config.existingConfigMapChecksum }}
{{- else }}
{{- fail "omp.config.existingConfigMapChecksum is required when the existing OMP ConfigMap cannot be looked up" }}
{{- end }}
{{- end }}
{{- $configChecksum := include "issue-agent.configmap.data" . | sha256sum }}
{{- if .Values.config.existingConfigMap }}
{{- $cfg := lookup "v1" "ConfigMap" .Release.Namespace .Values.config.existingConfigMap }}
{{- if $cfg }}
{{- $configChecksum = $cfg.data | toYaml | sha256sum }}
{{- else if .Values.config.existingConfigMapChecksum }}
{{- $configChecksum = .Values.config.existingConfigMapChecksum }}
{{- else }}
{{- fail "config.existingConfigMapChecksum is required when the existing IssueAgent ConfigMap cannot be looked up" }}
{{- end }}
{{- end }}
{{- $secretChecksum := .Values.secret.stringData | toYaml | sha256sum }}
{{- if .Values.secret.existingSecret }}
{{- $sec := lookup "v1" "Secret" .Release.Namespace .Values.secret.existingSecret }}
{{- if $sec }}
{{- $secretChecksum = $sec.data | toYaml | sha256sum }}
{{- else if .Values.secret.existingSecretChecksum }}
{{- $secretChecksum = .Values.secret.existingSecretChecksum }}
{{- else }}
{{- fail "secret.existingSecretChecksum is required when the existing Secret cannot be looked up" }}
{{- end }}
{{- end }}
{{- $brokerTokenSecretName := default (printf "%s-secret" (include "issue-agent.fullname" .)) .Values.secret.existingSecret }}
{{- $brokerTokenSecretKey := .Values.omp.authBroker.tokenSecretKey }}
{{- if and .Values.omp.authBroker.enabled (not .Values.secret.existingSecret) (not (hasKey .Values.secret.stringData $brokerTokenSecretKey)) }}
{{- fail "secret.stringData must contain omp.authBroker.tokenSecretKey when the Auth Broker is enabled" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "issue-agent.fullname" . }}
  labels:
    {{- include "issue-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: issue-agent
      {{- include "issue-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: issue-agent
        {{- include "issue-agent.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ $configChecksum }}
        checksum/omp-config: {{ $ompConfigChecksum }}
        checksum/secret: {{ $secretChecksum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: issue-agent
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ default (printf "%s-config" (include "issue-agent.fullname" .)) .Values.config.existingConfigMap }}
            {{- if or .Values.secret.existingSecret .Values.secret.stringData }}
            - secretRef:
                name: {{ default (printf "%s-secret" (include "issue-agent.fullname" .)) .Values.secret.existingSecret }}
            {{- end }}
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: HOME
              value: /data
            - name: PI_CODING_AGENT_DIR
              value: /data/omp/agent
            - name: PI_CODING_AGENT_SESSION_DIR
              value: /data/omp
            - name: OpenTelemetry__TraceSamplingRatio
              value: {{ .Values.config.traceSamplingRatio | quote }}
            {{- if .Values.config.otlpEndpoint }}
            - name: OpenTelemetry__OtlpEndpoint
              value: {{ .Values.config.otlpEndpoint | quote }}
            {{- end }}
            - name: PI_CONFIG_FILES
              value: {{ printf "%s/%s" .Values.omp.config.mountPath .Values.omp.config.file | quote }}
            {{- if .Values.omp.authBroker.enabled }}
            - name: IssueAgent__Omp__AuthBrokerUrl
              value: {{ printf "http://%s:8081" (include "issue-agent.authBrokerFullname" .) | quote }}
            {{- end }}
            {{- if .Values.omp.authBroker.enabled }}
            - name: IssueAgent__Omp__ExecutionSecrets__OMP_AUTH_BROKER_TOKEN__File
              value: /run/secrets/omp-auth-broker/token
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [SETGID, SETUID]
          volumeMounts:
            - name: workspace
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: omp-config
              mountPath: {{ .Values.omp.config.mountPath }}
              readOnly: true
            - name: issue-agent-secrets
              mountPath: /run/issue-agent-secrets
            {{- if or .Values.secret.existingSecret .Values.secret.stringData }}
            - name: issue-agent-secret-source
              mountPath: /run/secrets-source
              readOnly: true
            {{- end }}
            {{- if .Values.omp.authBroker.enabled }}
            - name: omp-auth-broker-token
              mountPath: /run/secrets/omp-auth-broker
              readOnly: true
            {{- end }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ default (include "issue-agent.fullname" .) .Values.workspace.existingClaim }}
        - name: tmp
          emptyDir: {}
        - name: issue-agent-secrets
          emptyDir:
            medium: Memory
        {{- if or .Values.secret.existingSecret .Values.secret.stringData }}
        - name: issue-agent-secret-source
          secret:
            secretName: {{ default (printf "%s-secret" (include "issue-agent.fullname" .)) .Values.secret.existingSecret }}
            defaultMode: 0400
        {{- end }}
        - name: omp-config
          configMap:
            name: {{ default (printf "%s-omp-config" (include "issue-agent.fullname" .)) .Values.omp.config.existingConfigMap }}
        {{- if .Values.omp.authBroker.enabled }}
        - name: omp-auth-broker-token
          secret:
            secretName: {{ $brokerTokenSecretName }}
            defaultMode: 0444
            items:
              - key: {{ $brokerTokenSecretKey }}
                path: token
        {{- end }}
