services:
  issue-agent:
    environment:
      IssueAgent__Omp__AuthBrokerUrl: http://omp-auth-broker:8081
      IssueAgent__Omp__ExecutionSecrets__OMP_AUTH_BROKER_TOKEN__File: /run/issue-agent-secrets/omp_auth_broker_token
    secrets:
      - source: omp_auth_broker_token
        target: /run/secrets-source/omp_auth_broker_token
        mode: 0400
  omp-auth-broker:
    image: ${OMP_AUTH_BROKER_IMAGE:-issue-agent:local}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown -R 10001:10001 /data
        chmod 2770 /data
        install -o 10001 -g 10001 -d -m 0700 /data/.omp
        install -o 10001 -g 10001 -m 0600 /run/secrets/omp_auth_broker_token /data/.omp/auth-broker.token
        exec /usr/bin/setpriv --reuid=10001 --regid=10001 --clear-groups --no-new-privs -- /usr/local/bin/omp auth-broker serve --bind=0.0.0.0:8081
    environment:
      HOME: /data
      PI_CODING_AGENT_DIR: /data/omp/agent
      PI_CODING_AGENT_SESSION_DIR: /data/omp
    secrets:
      - omp_auth_broker_token
    ports:
      # Keep the broker endpoint on the host loopback only.
      - "127.0.0.1:${OMP_AUTH_BROKER_PORT:-8081}:8081"
    volumes:
      - omp-auth-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    restart: unless-stopped

secrets:
  omp_auth_broker_token:
    file: ./secrets/omp-auth-broker-token

volumes:
  omp-auth-data:
