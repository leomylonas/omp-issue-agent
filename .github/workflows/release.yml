name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

# CI also runs for release-shaped tags. The gate below polls the CI workflow run
# for this exact tag because GitHub Actions has no cross-workflow `needs` dependency.
env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  await-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Require successful CI for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            ci_status="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == env.GITHUB_REF_NAME and .head_sha == env.GITHUB_SHA)] | sort_by(.created_at) | last // {} | "\(.status // ""):\(.conclusion // "")"')"
            case "$ci_status" in
              completed:success) exit 0 ;;
              completed:*) echo "Tag CI concluded: ${ci_status#completed:}" >&2; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for CI on tag ${GITHUB_REF_NAME} at ${GITHUB_SHA}." >&2
          exit 1

  publish:
    needs: await-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Validate stable SemVer and normalize version
        id: version
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must be strict stable SemVer (vX.Y.Z): ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.0
      - uses: docker/setup-qemu-action@v3.6.0
        with:
          platforms: all
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          provenance: true
          sbom: true
      - name: Package and publish Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package deploy/helm/issue-agent \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination /tmp/chart
          helm push "/tmp/chart/issue-agent-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
