name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.100
      - name: Restore
        run: dotnet restore IssueAgent.slnx --locked-mode
      - name: Format, analyzers, and build
        run: |
          dotnet format IssueAgent.slnx --no-restore --verify-no-changes
          dotnet build IssueAgent.slnx --no-restore --configuration Release -warnaserror
      - name: Install pinned git-lfs
        env:
          GIT_LFS_VERSION: 3.8.0
          GIT_LFS_SHA256: e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d
        run: |
          set -euo pipefail
          archive="git-lfs-linux-amd64-v${GIT_LFS_VERSION}.tar.gz"
          curl --fail --location --silent --show-error \
            --output "/tmp/${archive}" \
            "https://github.com/git-lfs/git-lfs/releases/download/v${GIT_LFS_VERSION}/${archive}"
          echo "${GIT_LFS_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar --extract --gzip --strip-components=1 \
            --file "/tmp/${archive}" \
            --directory /tmp \
            "git-lfs-${GIT_LFS_VERSION}/git-lfs"
          sudo install --mode=0755 /tmp/git-lfs /usr/local/bin/git-lfs
          git lfs version
      - name: Install pinned OMP smoke binary
        env:
          OMP_VERSION: 18.2.4
          OMP_SHA256: 61b4cd50ceaea70baccae7b52a22034469130ea2985a0b2e9adc0f7b3a77a85f
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output /tmp/omp \
            "https://github.com/can1357/oh-my-pi/releases/download/v${OMP_VERSION}/omp-linux-x64"
          echo "${OMP_SHA256}  /tmp/omp" | sha256sum --check --strict
          chmod 0755 /tmp/omp
      - name: Smoke pinned OMP binary
        env:
          OMP_TEST_BINARY: /tmp/omp
          OPENAI_API_KEY: ci-smoke
        run: dotnet test tests/IssueAgent.Omp.Tests/IssueAgent.Omp.Tests.csproj --no-build --configuration Release --logger trx
      - name: Unit and provider-contract tests
        run: dotnet test IssueAgent.slnx --no-build --configuration Release --logger trx --filter "FullyQualifiedName!~EndToEndLifecycleTests"
      - name: End-to-end lifecycle tests
        run: dotnet test tests/IssueAgent.Workflow.Tests/IssueAgent.Workflow.Tests.csproj --no-build --configuration Release --logger trx --filter "FullyQualifiedName~EndToEndLifecycleTests"
      - name: Git and LFS integration tests
        run: dotnet test tests/IssueAgent.Git.Tests/IssueAgent.Git.Tests.csproj --no-build --configuration Release --logger trx
      - name: Install Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.0
      - name: Validate Helm lint
        run: helm lint deploy/helm/issue-agent
      - name: Validate Helm templates and Kubernetes manifests
        run: |
          helm template issue-agent deploy/helm/issue-agent \
            --namespace issue-agent-monitoring \
            --set omp.authBroker.enabled=true \
            --set omp.authBroker.image.repository=ghcr.io/leomylonas/omp-issue-agent \
            --set omp.authBroker.image.tag=0.1.0 \
            --set-file secret.stringData.OMP_AUTH_BROKER_TOKEN=.github/fixtures/omp-auth-broker-token \
            --set prometheusRule.enabled=true \
            --set serviceMonitor.enabled=true \
            --set grafana.dashboard.enabled=true >/tmp/issue-agent-broker.yaml
          docker run --rm --interactive mikefarah/yq:4.47.2 \
            -e 'select(.kind == "ServiceMonitor") | (.spec.namespaceSelector.matchNames == ["issue-agent-monitoring"])' \
            < /tmp/issue-agent-broker.yaml
          docker run --rm --interactive mikefarah/yq:4.47.2 \
            -e 'select(.kind == "ServiceMonitor") | (.spec.targetLabels | contains(["app.kubernetes.io/namespace"]))' \
            < /tmp/issue-agent-broker.yaml
          docker run --rm --interactive mikefarah/yq:4.47.2 \
            -e 'select(.kind == "PrometheusRule") | select([.spec.groups[].rules[].expr | contains("app_kubernetes_io_namespace=\"issue-agent-monitoring\"")] | all)' \
            < /tmp/issue-agent-broker.yaml
          docker run --rm --interactive ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            < /tmp/issue-agent-broker.yaml
      - name: Validate Prometheus rules
        run: |
          helm template issue-agent deploy/helm/issue-agent --set prometheusRule.enabled=true > /tmp/issue-agent-monitoring.yaml
          docker run --rm --interactive mikefarah/yq:4.47.2 \
            'select(.kind == "PrometheusRule") | .spec' < /tmp/issue-agent-monitoring.yaml > /tmp/issue-agent-rules.yaml
          docker run --rm --volume /tmp:/work --entrypoint /bin/promtool prom/prometheus:v3.7.3 \
            check rules /work/issue-agent-rules.yaml
      - name: Validate Grafana JSON
        run: |
          helm template issue-agent deploy/helm/issue-agent --set grafana.dashboard.enabled=true > /tmp/issue-agent-dashboard.yaml
          docker run --rm --interactive mikefarah/yq:4.47.2 \
            'select(.data."issue-agent.json" != null) | .data."issue-agent.json"' \
            < /tmp/issue-agent-dashboard.yaml > /tmp/issue-agent-dashboard.json
          python3 -c "import json; json.load(open('/tmp/issue-agent-dashboard.json'))"
      - name: Validate Compose configuration
        env:
          GITHUB_TOKEN: ""
        run: |
          install --mode=0600 .github/fixtures/github-token deploy/secrets/github-token
          cp .github/fixtures/omp-auth-broker-token deploy/secrets/omp-auth-broker-token
          trap 'rm -f deploy/secrets/omp-auth-broker-token' EXIT
          docker compose -f deploy/docker-compose.yml config
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.auth-broker.yml config
      - name: Smoke Compose stack
        env:
          GITHUB_TOKEN: ""
        run: |
          install --mode=0600 .github/fixtures/github-token deploy/secrets/github-token
          docker compose -f deploy/docker-compose.yml up --detach --build --wait --wait-timeout 30
          container_id="$(docker compose -f deploy/docker-compose.yml ps --quiet issue-agent)"
          trap 'docker compose -f deploy/docker-compose.yml down --volumes' EXIT
          test "$(docker inspect --format '{{.State.Running}} {{.State.Health.Status}}' "$container_id")" = "true healthy"
          curl --fail --silent http://127.0.0.1:8080/health/live
          curl --fail --silent http://127.0.0.1:8080/health/ready
      - name: Validate Dockerfile
        run: docker buildx build --check --platform linux/amd64,linux/arm64 -f Dockerfile .
      - name: Build production container
        run: docker build --tag issue-agent:ci --file Dockerfile .
      - name: Smoke production container
        run: |
          container_id="$(docker run --detach --read-only --tmpfs /tmp --volume issue-agent-ci-data:/data --publish 127.0.0.1::8080 issue-agent:ci)"
          trap 'docker rm --force "$container_id"; docker volume rm issue-agent-ci-data' EXIT
          port="$(docker port "$container_id" 8080/tcp | sed 's/.*://')"
          for attempt in $(seq 1 40); do
            state="$(docker inspect --format '{{.State.Running}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container_id")"
            if [ "$state" = "true healthy" ] &&
              curl --fail --silent "http://127.0.0.1:${port}/health/live" &&
              curl --fail --silent "http://127.0.0.1:${port}/health/ready"; then
              exit 0
            fi
            if [ "$state" != "true starting" ] && [ "$state" != "true healthy" ]; then
              break
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

  publish-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-qemu-action@v3.6.0
        with:
          platforms: all
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          provenance: true
          sbom: true
